name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
  deployments: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# NOTE: Do NOT set cancel-in-progress to true! GitHub Pages deployments are asynchronous cloud operations.
# Aborting an in-progress Actions runner leaves the backend deployment locked in GitHub's Pages service,
# causing the subsequent run to fail with HTTP 400 (Deployment request failed due to in progress deployment).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Delete stale "github-pages" artifacts on re-run
        if: github.run_attempt > 1
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of artifacts.data.artifacts) {
              if (artifact.name === "github-pages") {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

      - name: Wait for pending Pages deployments and clear locks
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 1; attempt <= 10; attempt++) {
              try {
                const deployments = await github.rest.repos.listDeployments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  environment: 'github-pages',
                  per_page: 5
                });
                let busy = false;
                for (const d of deployments.data) {
                  if (d.sha !== context.sha) {
                    const statuses = await github.rest.repos.listDeploymentStatuses({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      deployment_id: d.id,
                      per_page: 1
                    });
                    const state = statuses.data[0]?.state;
                    if (state === 'in_progress' || state === 'queued' || state === 'pending') {
                      busy = true;
                      console.log(`Waiting for Pages deployment ${d.id} (${d.sha.slice(0, 7)}) with state '${state}' to finalize... (attempt ${attempt}/10)`);
                    }
                  }
                }
                if (!busy) {
                  console.log('Pages deployment environment is clear and ready.');
                  break;
                }
                await new Promise(r => setTimeout(r, 6000));
              } catch (err) {
                console.log(`Deployment check notice: ${err.message}`);
                break;
              }
            }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
