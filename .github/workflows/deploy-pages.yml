name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
  deployments: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# NOTE: Do NOT set cancel-in-progress to true! GitHub Pages deployments are asynchronous cloud operations.
# Aborting an in-progress Actions runner leaves the backend deployment locked in GitHub's Pages service,
# causing the subsequent run to fail with HTTP 400 (Deployment request failed due to in progress deployment).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Delete stale "github-pages" artifacts on re-run
        if: github.run_attempt > 1
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of artifacts.data.artifacts) {
              if (artifact.name === "github-pages") {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

      - name: Clear conflicting Pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const deployments = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: 'github-pages',
                per_page: 5
              });
              for (const d of deployments.data) {
                if (d.sha !== context.sha) {
                  try {
                    await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pages_deployment_id: d.sha
                    });
                    console.log(`Cancelled conflicting Pages deployment lock for ${d.sha}`);
                    await new Promise(r => setTimeout(r, 4000));
                  } catch (e) {
                    console.log(`Deployment note for ${d.sha}: ${e.message}`);
                  }
                }
              }
            } catch (err) {
              console.log(`Deployment check notice: ${err.message}`);
            }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
