name: Stamp last commit
# Last updated: 2026-07-08

# Runs on every push to main. Writes the triggering commit's SHA and ISO
# date into assets/js/last-commit.json, stamps the current release metadata,
# then commits both files back.
#
# Guard: the commit-back step is itself a push to main. Without the
# "skip if last commit author is the bot" check below, that second push
# would re-trigger this workflow, which would commit again, forever.
on:
  push:
    branches:
      - main

# Least-privilege: only grant write access to repo contents, and only
# for this workflow's own commit-back step.
permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    # Skip entirely if the triggering commit was made by this workflow's
    # own bot identity — breaks the loop described above.
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Resolve the commit that introduced VERSION, including no-bump pushes.
          fetch-depth: 0

      - name: Write last-commit.json
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_DATE: ${{ github.event.head_commit.timestamp }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p assets/js
          FIRST_LINE="$(printf '%s\n' "$COMMIT_MSG" | head -n 1)"
          jq -n \
            --arg sha "$COMMIT_SHA" \
            --arg shortSha "${COMMIT_SHA:0:7}" \
            --arg date "$COMMIT_DATE" \
            --arg msg "$FIRST_LINE" \
            '{sha: $sha, shortSha: $shortSha, date: $date, message: $msg}' > assets/js/last-commit.json
          cat assets/js/last-commit.json
          python3 scripts/site_automation.py stamp-release

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/js/last-commit.json assets/js/data/releases.js
          # Only commit if the file actually changed — avoids empty
          # commits when re-running or when the date format is identical
          # (won't happen in practice since SHA always changes, but cheap
          # to guard anyway).
          git diff --staged --quiet || git commit -m "chore: stamp last commit"
          # update-search-index.yml also triggers on this same push and
          # commits back to main in parallel — retry with rebase in case
          # it pushed first and this push would otherwise be rejected as
          # non-fast-forward.
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 1))
          done
          git push
