name: Visual Regression

# Last updated: 2026-09-08 (v51.4)
# Runs automated pixel-diff visual regression testing on Ubuntu runner
# using pre-installed Google Chrome headless and Pillow.

on:
  pull_request:
    paths:
      - '*.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'scripts/test_visual_regression.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pillow

      - name: Run Visual Regression Test Suite
        run: python3 scripts/test_visual_regression.py --tolerance 0.01
        env:
          FORCE_COLOR: "1"

      - name: Upload Visual Diffs Artifact on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: tests/visual/diffs/
