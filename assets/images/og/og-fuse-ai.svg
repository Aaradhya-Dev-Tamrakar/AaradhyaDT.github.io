<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f0e0c" />
            <stop offset="50%" stop-color="#161513" />
            <stop offset="100%" stop-color="#090807" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6dbfaa" />
            <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
        </pattern>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="30" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Background Layer -->
    <rect width="1200" height="630" fill="url(#bgGrad)" />
    <rect width="1200" height="630" fill="url(#grid)" />

    <!-- Ambient Glow Orbs -->
    <circle cx="1100" cy="100" r="180" fill="#6dbfaa" fill-opacity="0.08" filter="url(#glow)" />
    <circle cx="150" cy="550" r="160" fill="#3b82f6" fill-opacity="0.06" filter="url(#glow)" />

    <!-- Outer Frame & Accent Border -->
    <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />
    <rect x="24" y="24" width="1152" height="6" fill="url(#accentGrad)" />

    <!-- Top Badge -->
    <g transform="translate(80, 85)">
        <rect width="320" height="34" rx="4" fill="#6dbfaa" fill-opacity="0.12" stroke="#6dbfaa" stroke-opacity="0.35" stroke-width="1.2" />
        <text x="160" y="22" fill="#6dbfaa" font-family="'DM Mono', monospace, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.15em">FELLOWSHIP RESEARCH</text>
    </g>

    <!-- Title & Subtitle -->
    <text x="80" y="210" fill="#f8f5ee" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="700" letter-spacing="-0.02em">Fuse AI Text-to-SQL &amp; Analytics Engine</text>
    <text x="80" y="280" fill="#eeeae2" font-family="'Inter', -apple-system, sans-serif" font-size="26" font-weight="400" opacity="0.9">5-Stage Agentic NL-to-SQL Pipeline with AST Verification</text>

    <!-- Metadata Row -->
    <text x="80" y="345" fill="#b3ada4" font-family="'Inter', -apple-system, sans-serif" font-size="19" font-weight="400">100% Spider Benchmark · PyMC Bayesian Inference · Churn ROC-AUC 0.841</text>

    <!-- Decorative Divider Line -->
    <line x1="80" y1="420" x2="1120" y2="420" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1" />

    <!-- Tags Row -->
    
        <g transform="translate(80, 490)">
            <rect width="142" height="38" rx="6" fill="#161513" stroke="#6dbfaa" stroke-opacity="0.3" stroke-width="1.5" />
            <text x="71.0" y="24" fill="#eeeae2" font-family="'DM Mono', monospace, sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0.05em">LLM Agents</text>
        </g>
        
        <g transform="translate(236, 490)">
            <rect width="153" height="38" rx="6" fill="#161513" stroke="#6dbfaa" stroke-opacity="0.3" stroke-width="1.5" />
            <text x="76.5" y="24" fill="#eeeae2" font-family="'DM Mono', monospace, sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0.05em">Text-to-SQL</text>
        </g>
        
        <g transform="translate(403, 490)">
            <rect width="186" height="38" rx="6" fill="#161513" stroke="#6dbfaa" stroke-opacity="0.3" stroke-width="1.5" />
            <text x="93.0" y="24" fill="#eeeae2" font-family="'DM Mono', monospace, sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0.05em">Bayesian Stats</text>
        </g>
        
        <g transform="translate(603, 490)">
            <rect width="153" height="38" rx="6" fill="#161513" stroke="#6dbfaa" stroke-opacity="0.3" stroke-width="1.5" />
            <text x="76.5" y="24" fill="#eeeae2" font-family="'DM Mono', monospace, sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0.05em">Time Series</text>
        </g>
        
        <g transform="translate(770, 490)">
            <rect width="109" height="38" rx="6" fill="#161513" stroke="#6dbfaa" stroke-opacity="0.3" stroke-width="1.5" />
            <text x="54.5" y="24" fill="#eeeae2" font-family="'DM Mono', monospace, sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0.05em">FastAPI</text>
        </g>
        

    <!-- Watermark / Footer Domain -->
    <g transform="translate(940, 560)">
        <text x="0" y="0" fill="#b3ada4" font-family="'DM Mono', monospace, sans-serif" font-size="16" font-weight="500">aaradhyadt.github.io</text>
    </g>
</svg>
