<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f0e0c" />
            <stop offset="50%" stop-color="#161513" />
            <stop offset="100%" stop-color="#090807" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#d4a85a" />
            <stop offset="100%" stop-color="#fb923c" />
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
        </pattern>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="30" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Background Layer -->
    <rect width="1200" height="630" fill="url(#bgGrad)" />
    <rect width="1200" height="630" fill="url(#grid)" />

    <!-- Ambient Glow Orbs -->
    <circle cx="1100" cy="100" r="180" fill="#d4a85a" fill-opacity="0.08" filter="url(#glow)" />
    <circle cx="150" cy="550" r="160" fill="#fb923c" fill-opacity="0.06" filter="url(#glow)" />

    <!-- Outer Frame & Accent Border -->
    <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />
    <rect x="24" y="24" width="1152" height="6" fill="url(#accentGrad)" />

    <!-- Top Badge -->
    <g transform="translate(80, 85)">
        <rect width="320" height="34" rx="4" fill="#d4a85a" fill-opacity="0.12" stroke="#d4a85a" stroke-opacity="0.35" stroke-width="1.2" />
        <text x="160" y="22" fill="#d4a85a" font-family="'DM Mono', monospace, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.15em">FEATURED PROJECT · HARDWARE &amp; AI</text>
    </g>

    <!-- Title & Subtitle -->
    <text x="80" y="210" fill="#f8f5ee" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="700" letter-spacing="-0.02em">SPARK Edge-AI Wearable</text>
    <text x="80" y="280" fill="#eeeae2" font-family="'Inter', -apple-system, sans-serif" font-size="26" font-weight="400" opacity="0.9">Micro-CNN INT8 with On-Device SHAP Explainability</text>

    <!-- Metadata Row -->
    <text x="80" y="345" fill="#b3ada4" font-family="'Inter', -apple-system, sans-serif" font-size="19" font-weight="400">ESP32-S3 · TensorFlow Lite Micro · IMU Sensor Fusion · 42ms Inference</text>

    <!-- Decorative Divider Line -->
    <line x1="80" y1="420" x2="1120" y2="420" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1" />

    <!-- Tags Row -->
    
        <g transform="translate(80, 490)">
            <rect width="109" height="38" rx="6" fill="#161513" stroke="#d4a85a" stroke-opacity="0.3" stroke-width="1.5" />
            <text x="54.5" y="24" fill="#eeeae2" font-family="'DM Mono', monospace, sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0.05em">Edge AI</text>
        </g>
        
        <g transform="translate(203, 490)">
            <rect width="164" height="38" rx="6" fill="#161513" stroke="#d4a85a" stroke-opacity="0.3" stroke-width="1.5" />
            <text x="82.0" y="24" fill="#eeeae2" font-family="'DM Mono', monospace, sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0.05em">TFLite Micro</text>
        </g>
        
        <g transform="translate(381, 490)">
            <rect width="186" height="38" rx="6" fill="#161513" stroke="#d4a85a" stroke-opacity="0.3" stroke-width="1.5" />
            <text x="93.0" y="24" fill="#eeeae2" font-family="'DM Mono', monospace, sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0.05em">Explainable AI</text>
        </g>
        
        <g transform="translate(581, 490)">
            <rect width="65" height="38" rx="6" fill="#161513" stroke="#d4a85a" stroke-opacity="0.3" stroke-width="1.5" />
            <text x="32.5" y="24" fill="#eeeae2" font-family="'DM Mono', monospace, sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0.05em">C++</text>
        </g>
        
        <g transform="translate(660, 490)">
            <rect width="120" height="38" rx="6" fill="#161513" stroke="#d4a85a" stroke-opacity="0.3" stroke-width="1.5" />
            <text x="60.0" y="24" fill="#eeeae2" font-family="'DM Mono', monospace, sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0.05em">Hardware</text>
        </g>
        

    <!-- Watermark / Footer Domain -->
    <g transform="translate(940, 560)">
        <text x="0" y="0" fill="#b3ada4" font-family="'DM Mono', monospace, sans-serif" font-size="16" font-weight="500">aaradhyadt.github.io</text>
    </g>
</svg>
